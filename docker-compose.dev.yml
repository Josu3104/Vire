services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    image: vire-frontend-dev
    container_name: vire-frontend-dev
    command: npm run dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    image: vire-backend-dev
    container_name: vire-backend-dev
    command: sh -c "npx prisma generate && npm run start:dev"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vire:${POSTGRES_PASSWORD:-vire_dev_2026}@postgres:5432/vire_db
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_dev_key_2026}
      JWT_EXPIRATION: 7d
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SEAWEED_S3_ENDPOINT: http://seaweed-filer:8333
      SEAWEED_S3_BUCKET: vire-storage
      SEAWEED_S3_REGION: us-east-1
      SEAWEED_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:-admin}
      SEAWEED_SECRET_KEY: ${SEAWEED_SECRET_KEY:-admin}
      CORS_ORIGIN: http://localhost:5173
      BREVO_API_KEY: ${BREVO_API_KEY:-""}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      seaweed-filer:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: vire-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: vire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vire_dev_2026}
      POSTGRES_DB: vire_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vire -d vire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: vire-seaweed-master-dev
    command: "master -ip=seaweed-master -port=9333"
    ports:
      - "9333:9333"

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: vire-seaweed-volume-dev
    command: "volume -mserver=seaweed-master:9333 -port=8080 -ip=seaweed-volume -max=100"
    depends_on:
      - seaweed-master
    ports:
      - "8080:8080"

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: vire-seaweed-filer-dev
    command: "filer -master=seaweed-master:9333 -port=8888 -s3 -s3.port=8333"
    depends_on:
      - seaweed-master
      - seaweed-volume
    ports:
      - "8888:8888"
      - "8333:8333"
    volumes:
      - seaweed_data_dev:/data

  clamav:
    image: clamav/clamav:stable
    container_name: vire-clamav-dev
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data_dev:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data_dev:
  seaweed_data_dev:
  clamav_data_dev:
