services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    image: vire-frontend-dev
    container_name: vire-frontend-dev
    command: npm run dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    image: vire-backend-dev
    container_name: vire-backend-dev
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vire:${POSTGRES_PASSWORD:-vire_dev_2026}@postgres:5432/vire_db
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_dev_key_2026}
      JWT_EXPIRATION: 7d
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:5173
      S3_BUCKET: vire-storage
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-admin1234}
      CORS_ORIGIN: http://localhost:5173
      BREVO_API_KEY: ${BREVO_API_KEY:-""}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: vire-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: vire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vire_dev_2026}
      POSTGRES_DB: vire_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vire -d vire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vire-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-admin1234}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "8333:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    container_name: vire-clamav-dev
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data_dev:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data_dev:
  minio_data_dev:
  clamav_data_dev:
