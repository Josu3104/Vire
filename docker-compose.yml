
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In Railway, set VITE_API_URL to your backend Railway public URL
        # e.g. https://vire-backend.up.railway.app
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: vire-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vire-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vire:${POSTGRES_PASSWORD:-vire_prod_2026}@postgres:5432/vire_db}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRATION: 7d
      # ClamAV disabled for POC (uncomment and add clamav service for production)
      CLAMAV_HOST: ""
      CLAMAV_PORT: ""
      # MinIO internal URL (container-to-container)
      S3_ENDPOINT: http://minio:9000
      # Public URL used to generate download links (set to your Railway frontend URL)
      # e.g. https://vire-frontend.up.railway.app
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost}
      S3_BUCKET: vire-storage
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change_me_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      BREVO_API_KEY: ${BREVO_API_KEY:-""}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vire_prod_2026}
      POSTGRES_DB: vire_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vire -d vire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3 Compatible Storage) ──
  minio:
    image: minio/minio:latest
    container_name: vire-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change_me_in_production}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "8333:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5



  # ─── ClamAV (disabled for POC - uncomment for full production) ──
  # clamav:
  #   image: clamav/clamav:stable
  #   container_name: vire-clamav
  #   restart: unless-stopped
  #   ports:
  #     - "3310:3310"
  #   volumes:
  #     - clamav_data:/var/lib/clamav
  #   healthcheck:
  #     test: ["CMD-SHELL", "echo PING | nc localhost 3310 || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s

volumes:
  postgres_data:
  minio_data:
