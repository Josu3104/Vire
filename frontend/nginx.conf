server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Permitir archivos de hasta 10GB
    client_max_body_size 10G;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache para index.html para asegurar que siempre se cargue la última versión
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy a la API del backend
    location /api/ {
        proxy_pass http://backend.railway.internal:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSockets support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy para WebSockets (Socket.io usa /socket.io/ por defecto)
    location /socket.io/ {
        proxy_pass http://backend.railway.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy para MinIO (archivos subidos: portadas, papers, ZIPs, etc.)
    # Las URLs generadas por el backend apuntan a /vire-storage/...
    location /vire-storage/ {
        proxy_pass http://minio.railway.internal:9000/vire-storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Pasar los query params de firma AWS sin alterar
        proxy_pass_request_headers on;
    }
}
